# Copy to secrets.yaml, fill in real values, and DO NOT commit it.
# Alternatively, create with:
#   kubectl create secret generic puppetmaster-secrets -n puppetmaster \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgres://puppetmaster:...@postgres:5432/puppetmaster' \
#     --from-literal=REDIS_URL='redis://redis:6379'
apiVersion: v1
kind: Secret
metadata:
  name: puppetmaster-secrets
  namespace: puppetmaster
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  DATABASE_URL: "postgres://puppetmaster:changeme@postgres:5432/puppetmaster"
  REDIS_URL: "redis://redis:6379"
