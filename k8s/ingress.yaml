# Requires the ingress-nginx controller and (optionally) cert-manager installed on the cluster.
# See docs/AKS-SETUP.md step 8.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server
  namespace: puppetmaster
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - puppetmaster.example.com
      secretName: puppetmaster-tls
  rules:
    - host: puppetmaster.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 80
