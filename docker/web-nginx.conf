worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Log only the canonical path, never query strings that can contain signed
  # artifact capabilities or OAuth material.
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  etag on;

  # The application enforces the authoritative Science upload ceiling. This
  # proxy ceiling matches its maximum supported value and streams request and
  # response bodies so the read-only gateway never spools large artifacts.
  client_max_body_size 16g;
  client_body_timeout 300s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  upstream puppetmaster_api {
    zone puppetmaster_api 64k;
    server server:4000 resolve;
    keepalive 32;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /api {
      proxy_pass http://puppetmaster_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_socket_keepalive on;
      proxy_connect_timeout 5s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
    }

    # This single proxy boundary preserves cookie auth, WebSocket upgrades at
    # /api/events, artifact streaming, and all render-session gateway suffixes.
    location ^~ /api/ {
      proxy_pass http://puppetmaster_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_socket_keepalive on;
      proxy_connect_timeout 5s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
    }

    location ^~ /assets/ {
      try_files $uri =404;
      include /etc/nginx/web-security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
      include /etc/nginx/web-security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      include /etc/nginx/web-security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
