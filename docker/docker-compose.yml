name: puppetmaster

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: puppetmaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: puppetmaster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puppetmaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  science-volume-init:
    image: node:22-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 1000:1000 /artifacts /quarantine
    volumes:
      - science_artifacts:/artifacts
      - science_quarantine:/quarantine
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://puppetmaster:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/puppetmaster
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      SCIENCE_ENABLED: ${SCIENCE_ENABLED:-0}
      SCIENCE_READ_ONLY: ${SCIENCE_READ_ONLY:-1}
      SCIENCE_SUBMISSIONS_DISABLED: ${SCIENCE_SUBMISSIONS_DISABLED:-}
      SCIENCE_SIGNING_SECRET: ${SCIENCE_SIGNING_SECRET:-}
      SCIENCE_MAX_UPLOAD_BYTES: ${SCIENCE_MAX_UPLOAD_BYTES:-2147483648}
      SCIENCE_MAX_WORKSPACE_STORAGE_BYTES: ${SCIENCE_MAX_WORKSPACE_STORAGE_BYTES:-8589934592}
      SCIENCE_UPLOAD_TTL_SECONDS: ${SCIENCE_UPLOAD_TTL_SECONDS:-3600}
      SCIENCE_EXTERNAL_UPLOAD_ABSOLUTE_TIMEOUT_MS: ${SCIENCE_EXTERNAL_UPLOAD_ABSOLUTE_TIMEOUT_MS:-3600000}
      SCIENCE_EXTERNAL_UPLOAD_IDLE_TIMEOUT_MS: ${SCIENCE_EXTERNAL_UPLOAD_IDLE_TIMEOUT_MS:-60000}
      SCIENCE_MAX_CONCURRENT_EXTERNAL_UPLOAD_STREAMS: ${SCIENCE_MAX_CONCURRENT_EXTERNAL_UPLOAD_STREAMS:-4}
      SCIENCE_RENDER_TTL_SECONDS: ${SCIENCE_RENDER_TTL_SECONDS:-900}
      SCIENCE_MAX_CONCURRENT_RUNS: ${SCIENCE_MAX_CONCURRENT_RUNS:-2}
      SCIENCE_MAX_CONCURRENT_RENDER_SESSIONS: ${SCIENCE_MAX_CONCURRENT_RENDER_SESSIONS:-2}
      SCIENCE_POLL_INTERVAL_MS: ${SCIENCE_POLL_INTERVAL_MS:-1000}
      SCIENCE_RATE_LIMIT_READS_PER_MINUTE: ${SCIENCE_RATE_LIMIT_READS_PER_MINUTE:-600}
      SCIENCE_RATE_LIMIT_WRITES_PER_MINUTE: ${SCIENCE_RATE_LIMIT_WRITES_PER_MINUTE:-120}
      SCIENCE_AUTOMATION_USER_ID: ${SCIENCE_AUTOMATION_USER_ID:-}
      SCIENCE_STORAGE_DRIVER: ${SCIENCE_STORAGE_DRIVER:-filesystem}
      SCIENCE_S3_ENDPOINT: ${SCIENCE_S3_ENDPOINT:-}
      SCIENCE_S3_REGION: ${SCIENCE_S3_REGION:-us-east-1}
      SCIENCE_S3_BUCKET: ${SCIENCE_S3_BUCKET:-}
      SCIENCE_S3_ACCESS_KEY_ID: ${SCIENCE_S3_ACCESS_KEY_ID:-}
      SCIENCE_S3_SECRET_ACCESS_KEY: ${SCIENCE_S3_SECRET_ACCESS_KEY:-}
      SCIENCE_S3_REQUEST_TIMEOUT_MS: ${SCIENCE_S3_REQUEST_TIMEOUT_MS:-300000}
      SCIENCE_PUBLIC_BASE_URL: ${SCIENCE_PUBLIC_BASE_URL:-}
      SCIENCE_RUNTIME_URL: ${SCIENCE_RUNTIME_URL:-}
      SCIENCE_RUNTIME_TOKEN: ${SCIENCE_RUNTIME_TOKEN:-}
      SCIENCE_RUNTIME_ADMISSION: ${SCIENCE_RUNTIME_ADMISSION:-}
      SCIENCE_RUNTIME_TIMEOUT_MS: ${SCIENCE_RUNTIME_TIMEOUT_MS:-15000}
      SCIENCE_FIXTURE_PROVISIONING_MS: ${SCIENCE_FIXTURE_PROVISIONING_MS:-100}
      SCIENCE_FIXTURE_RUNNING_MS: ${SCIENCE_FIXTURE_RUNNING_MS:-300}
      SCIENCE_RENDER_URL: ${SCIENCE_RENDER_URL:-}
      SCIENCE_RENDER_TOKEN: ${SCIENCE_RENDER_TOKEN:-}
      SCIENCE_RENDER_ADMISSION: ${SCIENCE_RENDER_ADMISSION:-}
      SCIENCE_RENDER_TIMEOUT_MS: ${SCIENCE_RENDER_TIMEOUT_MS:-15000}
      SCIENCE_ARTIFACT_ROOT: /var/lib/puppetmaster-science/artifacts
      SCIENCE_QUARANTINE_ROOT: /var/lib/puppetmaster-science/quarantine
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/api/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - default
      - science_control
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      science-volume-init:
        condition: service_completed_successfully
    volumes:
      - science_artifacts:/var/lib/puppetmaster-science/artifacts
      - science_quarantine:/var/lib/puppetmaster-science/quarantine
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 256
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "${PUPPETMASTER_WEB_BIND_ADDRESS:-127.0.0.1}:${PUPPETMASTER_WEB_PORT:-4000}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web_edge
      - web_gateway
    depends_on:
      server:
        condition: service_healthy
    init: true
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: "0.50"
    mem_limit: 128m
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 64
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  science-runtime:
    profiles: ["science"]
    build:
      context: ../services/science-runtime
      dockerfile: Dockerfile
    environment:
      SCIENCE_RUNTIME_HOST: 0.0.0.0
      SCIENCE_RUNTIME_PORT: "8090"
      SCIENCE_RUNTIME_STATE_DIR: /var/lib/science-runtime
      SCIENCE_RUNTIME_TOKEN: ${SCIENCE_RUNTIME_TOKEN:-}
      SCIENCE_RUNTIME_ALLOWED_INPUT_ORIGINS: ${SCIENCE_RUNTIME_ALLOWED_INPUT_ORIGINS:-http://server:4000}
      SCIENCE_RUNTIME_ALLOWED_IMAGE_DIGESTS: ${SCIENCE_RUNTIME_ALLOWED_IMAGE_DIGESTS:-sha256:1445edcf2ab7a2400b0851810d78bf572ad104afc8518f5cd207d88c528b72d6}
      SCIENCE_RUNTIME_ALLOWED_KERNELS: ${SCIENCE_RUNTIME_ALLOWED_KERNELS:-python-fixture-v1}
      SCIENCE_RUNTIME_MAX_CONCURRENCY: ${SCIENCE_RUNTIME_MAX_CONCURRENCY:-1}
      SCIENCE_RUNTIME_FIXTURE_DELAY_MS: ${SCIENCE_RUNTIME_FIXTURE_DELAY_MS:-100}
      SCIENCE_RUNTIME_MAX_CPU_MILLICORES: ${SCIENCE_RUNTIME_MAX_CPU_MILLICORES:-1000}
      SCIENCE_RUNTIME_MAX_MEMORY_MB: ${SCIENCE_RUNTIME_MAX_MEMORY_MB:-512}
      SCIENCE_RUNTIME_MAX_GPU_COUNT: ${SCIENCE_RUNTIME_MAX_GPU_COUNT:-0}
      SCIENCE_RUNTIME_MAX_WALL_SECONDS: ${SCIENCE_RUNTIME_MAX_WALL_SECONDS:-300}
    expose:
      - "8090"
    volumes:
      - science_runtime_data:/var/lib/science-runtime
    networks:
      - science_control
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: "1.0"
    mem_limit: 768m
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 64
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  science_artifacts:
  science_quarantine:
  science_runtime_data:

networks:
  science_control:
    internal: true
  web_edge:
  web_gateway:
    internal: true
